<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أمي وأبي</title>
<link rel="stylesheet" href="assets/css/player.css">
</head>
<body>
<div id="stage" aria-label="أمي وأبي — عرض شرائح">
  <svg id="bg" class="full" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <div id="scenes"></div>
  <svg id="chip" class="full" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <div id="controls">
    <button id="btnNext" class="ctl" type="button" aria-label="التالي"></button>
    <button id="btnMain" class="ctl main" type="button" aria-label="تشغيل" data-mode="play"></button>
    <button id="btnPrev" class="ctl" type="button" aria-label="السابق"></button>
  </div>
  <button id="startBtn" class="ctl big" type="button" aria-label="ابدأ" hidden></button>
  <div id="end" hidden>
    <button id="endReplay" class="ctl big" type="button" aria-label="إعادة من البداية"></button>
  </div>
  <div id="loader"><div id="load"><div id="loadbar"></div></div></div>
</div>
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/howler.core.min.js"></script>
<script src="assets/js/svg-shim.js"></script>
<script src="assets/js/selahkg-ds.js"></script>
<script src="assets/js/lesson-data.js"></script>
<script src="assets/js/player.js"></script>
<script src="assets/js/lesson.js"></script>
</body>
</html>
